spring:
  application:
    name: tripilot-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/tripilot;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-dev-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-dev-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:VHJpcGlsb3QtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1tdXN0LWJlLXJlcGxhY2VkLWZvci1wcm9kdWN0aW9uLW9ubHk=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  google:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
